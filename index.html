<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文智比 - 论文比较工具</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1/mammoth.browser.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;background:#f0f2f5;min-height:100vh}
.header{background:#fff;padding:12px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.header-brand{font-size:28px;font-weight:900;background:linear-gradient(135deg,#d93025 0%,#c5221f 50%,#a50e0e 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:6px}
.header-title{font-size:16px;color:#5f6368;font-weight:400}
.main{padding:16px 24px;max-width:1600px;margin:0 auto}
.columns{display:flex;gap:0;align-items:stretch}
.panel{flex:1;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.panel-left{border:2px solid #e8a0a0}
.panel-right{border:2px solid #a0b8e8}
.panel-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fafafa;border-bottom:1px solid #e0e0e0}
.panel-left .panel-header{background:#fef7f7}
.panel-right .panel-header{background:#f5f8fd}
.panel-title{font-size:16px;font-weight:700}
.panel-left .panel-title{color:#c5221f}
.panel-right .panel-title{color:#1a73e8}
.btn-import{font-size:12px;padding:4px 12px;border:1px solid #dadce0;border-radius:4px;background:#fff;cursor:pointer;color:#5f6368}
.btn-import:hover{background:#f1f3f4}
.panel-body{flex:1;position:relative;min-height:350px}
.text-input{width:100%;height:100%;min-height:350px;padding:14px;border:none;resize:none;font-size:14px;line-height:1.8;font-family:inherit;outline:none;position:absolute;top:0;left:0}
.diff-display{position:absolute;top:0;left:0;width:100%;height:100%;padding:14px;font-size:14px;line-height:1.8;overflow-y:auto;display:none;white-space:pre-wrap;word-wrap:break-word}
.diff-display.active{display:block}
.text-input.hidden{display:none}
.diff-equal{color:#202124}
.diff-removed{background:#fce8e6;color:#c5221f;text-decoration:line-through}
.diff-added{background:#e8f0fe;color:#1a73e8;font-weight:700}
.center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;gap:10px;min-width:80px}
.btn-compare{width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,#ea4335,#c5221f);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(234,67,53,.3);line-height:1.3;transition:transform .15s}
.btn-compare:hover{transform:scale(1.08)}
.btn-compare:active{transform:scale(.95)}
.btn-reset{padding:4px 14px;border:1px solid #dadce0;border-radius:14px;background:#fff;color:#5f6368;cursor:pointer;font-size:12px}
.btn-reset:hover{background:#f1f3f4}
.sync-slider-container{width:24px;height:200px;background:#e8eaed;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.sync-thumb{width:20px;height:40px;background:#5f6368;border-radius:10px;position:absolute;top:0;cursor:grab;transition:box-shadow .15s}
.sync-thumb:hover{box-shadow:0 0 0 4px rgba(95,99,104,.2)}
.sync-label{font-size:11px;color:#9aa0a6;writing-mode:vertical-rl;letter-spacing:2px}
.ai-section{margin-top:20px;border:1px solid #ceead6;border-radius:8px;overflow:hidden;background:#fff}
.ai-section-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f0faf3;border-bottom:1px solid #ceead6}
.ai-title{font-size:15px;font-weight:600;color:#1e8e3e}
.ai-result{padding:16px;font-size:14px;line-height:1.8;color:#1e8e3e;max-height:360px;overflow-y:auto;min-height:60px}
.ai-result.loading{color:#5f6368;font-style:italic}
.ai-result.error{color:#d93025}
.footer{display:flex;justify-content:space-between;align-items:flex-end;padding:20px 24px;max-width:1600px;margin:0 auto}
.footer-left{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.footer-logo-img{height:90px;object-fit:contain}
.footer-brand{font-size:16px;font-weight:700;color:#202124;letter-spacing:2px}
.footer-counter{font-size:12px;color:#5f6368}
.footer-right{display:flex;gap:20px;align-items:flex-end}
.qr-item{text-align:center}
.qr-item img{width:90px;height:90px;border-radius:6px;border:1px solid #e0e0e0}
.qr-label{font-size:11px;color:#5f6368;margin-top:4px}
.ai-result h3{font-size:18px;font-weight:700;color:#1a73e8;margin:20px 0 10px;border-bottom:2px solid #1a73e8;padding-bottom:6px}
.ai-result h4{font-size:15px;font-weight:600;color:#202124;margin:14px 0 6px;padding-left:8px;border-left:3px solid #1a73e8}
.ai-result p{margin:6px 0;line-height:1.7}
.ai-result ul{padding-left:20px;margin:4px 0}
.ai-result li{margin:3px 0;line-height:1.6}
.ai-result li::marker{color:#1a73e8}
.ai-result strong{color:#d93025}
#fileInput{display:none}
@media(max-width:900px){
  .columns{flex-direction:column}
  .center-col{flex-direction:row;padding:12px 0;min-width:auto}
  .sync-slider-container{display:none}
  .sync-label{display:none}
  .panel-body{min-height:250px}
  .text-input{min-height:250px}
  .footer{flex-direction:column;align-items:center;gap:16px}
}
</style>
</head>
<body>

<div class="header">
  <span class="header-brand">文智比</span>
  <span class="header-title">论文比较工具</span>
</div>

<div class="main">
  <div class="columns">
    <!-- Left Panel -->
    <div class="panel panel-left">
      <div class="panel-header">
        <span class="panel-title">文本A</span>
        <button class="btn-import" id="btnImportA">导入本地文件</button>
      </div>
      <div class="panel-body">
        <textarea class="text-input" id="textA" placeholder="在此粘贴论文A的内容，或点击上方按钮导入..."></textarea>
        <div class="diff-display" id="diffA"></div>
      </div>
    </div>

    <!-- Center -->
    <div class="center-col">
      <button class="btn-compare" id="btnCompare">比<br>较</button>
      <button class="btn-reset" id="btnReset">重置</button>
      <div class="sync-slider-container" id="syncContainer">
        <div class="sync-thumb" id="syncThumb"></div>
      </div>
      <div class="sync-label">联动滚动</div>
    </div>

    <!-- Right Panel -->
    <div class="panel panel-right">
      <div class="panel-header">
        <span class="panel-title">文本B</span>
        <button class="btn-import" id="btnImportB">导入本地文件</button>
      </div>
      <div class="panel-body">
        <textarea class="text-input" id="textB" placeholder="在此粘贴论文B的内容，或点击上方按钮导入..."></textarea>
        <div class="diff-display" id="diffB"></div>
      </div>
    </div>
  </div>

  <!-- AI Section -->
  <div class="ai-section">
    <div class="ai-section-header">
      <span class="ai-title">智能检测内核（仅供参考）</span>
    </div>
    <div class="ai-result" id="aiResult"></div>
  </div>
</div>

<!-- Footer -->

<script>
(function(){
// ===== Visit Counter =====
var count = parseInt(localStorage.getItem('wenZhiBi_visitCount') || '0') + 1;
localStorage.setItem('wenZhiBi_visitCount', count);
document.getElementById('visitCounter').textContent = '应用已被使用 ' + count + ' 次';

// ===== State =====
var isDiffMode = false;
var currentImportTarget = 'left';
var syncDragging = false;

// ===== DOM refs =====
var textA = document.getElementById('textA');
var textB = document.getElementById('textB');
var diffA = document.getElementById('diffA');
var diffB = document.getElementById('diffB');
var aiResult = document.getElementById('aiResult');
var fileInput = document.getElementById('fileInput');
var syncThumb = document.getElementById('syncThumb');
var syncContainer = document.getElementById('syncContainer');

// ===== Toast =====
function toast(msg, duration){
  duration = duration || 2000;
  var el = document.getElementById('toast') || (function(){
    var t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t);
    return t;
  })();
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._timer);
  el._timer = setTimeout(function(){ el.style.opacity = '0'; }, duration);
}

// ===== Word-level Diff =====
// Tokenize text into meaningful tokens (Chinese chars, English words, punctuation, whitespace)
function tokenize(text){
  var tokens = [];
  // Each Chinese char as separate token, English words grouped, whitespace/punctuation individually
  var re = /[\u4e00-\u9fff]|[a-zA-Z0-9]+|\s+|[^\u4e00-\u9fffa-zA-Z0-9\s]/g;
  var m;
  while((m = re.exec(text)) !== null){
    tokens.push(m[0]);
  }
  return tokens;
}

// Compute LCS dp table (forward)
function computeLCS(a, b){
  var m = a.length, n = b.length;
  var dp = new Array(m+1);
  for(var i=0;i<=m;i++){ dp[i]=new Array(n+1); for(var j=0;j<=n;j++) dp[i][j]=0; }
  for(var i=1;i<=m;i++){
    for(var j=1;j<=n;j++){
      if(a[i-1] === b[j-1]) dp[i][j] = dp[i-1][j-1]+1;
      else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp;
}

// Standard LCS backtrack: build diff chunks in correct order
function wordDiff(text1, text2){
  var a = tokenize(text1);
  var b = tokenize(text2);
  var dp = computeLCS(a, b);

  // Backtrack from dp[m][n] to (0,0), collecting path entries
  var path = [];
  var i = a.length, j = b.length;

  while(i > 0 || j > 0){
    if(i > 0 && j > 0 && a[i-1] === b[j-1]){
      path.push({type:'equal', tok:a[i-1]});
      i--; j--;
    } else if(j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])){
      path.push({type:'bDiff', tok:b[j-1]});
      j--;
    } else {
      path.push({type:'aDiff', tok:a[i-1]});
      i--;
    }
  }

  path.reverse();

  // Merge consecutive tokens into diff/equal chunks
  var chunks = [];
  var bufA = [], bufB = [];

  for(var k = 0; k < path.length; k++){
    var p = path[k];
    if(p.type === 'equal'){
      if(bufA.length || bufB.length){
        chunks.push({type:'diff', a:bufA.join(''), b:bufB.join('')});
        bufA = []; bufB = [];
      }
      chunks.push({type:'equal', a:p.tok, b:p.tok});
    } else if(p.type === 'aDiff'){
      bufA.push(p.tok);
    } else {
      bufB.push(p.tok);
    }
  }
  if(bufA.length || bufB.length){
    chunks.push({type:'diff', a:bufA.join(''), b:bufB.join('')});
  }

  return chunks;
}

// ===== Compare =====
function runCompare(){
  var tA = textA.value.trim();
  var tB = textB.value.trim();

  if(!tA || !tB){
    toast('请在两个文本框中输入内容');
    return;
  }

  try {
    var diffs = wordDiff(tA, tB);
    var esc = function(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

    var htmlA = '', htmlB = '';
    for(var i=0;i<diffs.length;i++){
      var d = diffs[i];
      if(d.type === 'equal'){
        htmlA += esc(d.a);
        htmlB += esc(d.b);
      } else {
        if(d.a) htmlA += '<span class="diff-removed">' + esc(d.a) + '</span>';
        if(d.b) htmlB += '<span class="diff-added">' + esc(d.b) + '</span>';
      }
    }

    textA.classList.add('hidden');
    textB.classList.add('hidden');
    diffA.innerHTML = htmlA;
    diffB.innerHTML = htmlB;
    diffA.classList.add('active');
    diffB.classList.add('active');
    isDiffMode = true;
    resetSyncThumb();

    toast('比较完成');
    runAICompare();
  } catch(e){
    toast('比较失败: ' + e.message, 4000);
    console.error(e);
  }
}

// ===== Reset =====
function resetAll(){
  textA.classList.remove('hidden');
  textB.classList.remove('hidden');
  diffA.classList.remove('active');
  diffB.classList.remove('active');
  diffA.innerHTML = '';
  diffB.innerHTML = '';
  isDiffMode = false;
  aiResult.textContent = '';
  aiResult.className = 'ai-result';
  resetSyncThumb();
  toast('已重置');
}

// ===== Sync Slider =====
function getActivePanels(){
  return isDiffMode ? {left:diffA, right:diffB} : {left:textA, right:textB};
}

function resetSyncThumb(){
  syncThumb.style.top = '0px';
}

function updateSyncThumb(){
  var panels = getActivePanels();
  var pL = panels.left.scrollHeight > panels.left.clientHeight ? panels.left.scrollTop / (panels.left.scrollHeight - panels.left.clientHeight) : 0;
  var pR = panels.right.scrollHeight > panels.right.clientHeight ? panels.right.scrollTop / (panels.right.scrollHeight - panels.right.clientHeight) : 0;
  var avg = (pL + pR) / 2;
  var maxTop = syncContainer.clientHeight - syncThumb.clientHeight;
  syncThumb.style.top = (avg * maxTop) + 'px';
}

syncThumb.addEventListener('mousedown', function(e){
  e.preventDefault();
  syncDragging = true;
});

document.addEventListener('mousemove', function(e){
  if(!syncDragging) return;
  var rect = syncContainer.getBoundingClientRect();
  var thumbH = syncThumb.clientHeight;
  var maxTop = rect.height - thumbH;
  var offsetY = Math.max(0, Math.min(maxTop, e.clientY - rect.top - thumbH/2));
  var pct = maxTop > 0 ? offsetY / maxTop : 0;
  syncThumb.style.top = offsetY + 'px';
  var panels = getActivePanels();
  panels.left.scrollTop = pct * (panels.left.scrollHeight - panels.left.clientHeight);
  panels.right.scrollTop = pct * (panels.right.scrollHeight - panels.right.clientHeight);
});

document.addEventListener('mouseup', function(){
  syncDragging = false;
});

syncContainer.addEventListener('click', function(e){
  if(e.target === syncThumb) return;
  var rect = syncContainer.getBoundingClientRect();
  var thumbH = syncThumb.clientHeight;
  var maxTop = rect.height - thumbH;
  var offsetY = Math.max(0, Math.min(maxTop, e.clientY - rect.top - thumbH/2));
  var pct = maxTop > 0 ? offsetY / maxTop : 0;
  syncThumb.style.top = offsetY + 'px';
  var panels = getActivePanels();
  panels.left.scrollTop = pct * (panels.left.scrollHeight - panels.left.clientHeight);
  panels.right.scrollTop = pct * (panels.right.scrollHeight - panels.right.clientHeight);
});

// ===== File Import =====
document.getElementById('btnImportA').addEventListener('click', function(){

  fileInput.click();

fileInput.addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var ext = file.name.split('.').pop().toLowerCase();
  var target = currentImportTarget === 'left' ? textA : textB;

  if(ext === 'txt' || ext === 'md'){
    var reader = new FileReader();
    reader.onload = function(ev){ target.value = ev.target.result; toast('导入成功'); };
    reader.readAsText(file);
  } else if(ext === 'docx'){
    var reader = new FileReader();
    reader.onload = function(ev){
      if(typeof mammoth === 'undefined'){ toast('mammoth.js 未加载，请刷新重试', 3000); return; }
      mammoth.extractRawText({arrayBuffer: ev.target.result})
        .then(function(r){ target.value = r.value; toast('导入成功'); })
        .catch(function(err){ toast('解析失败: ' + err.message, 3000); });
    };
    reader.readAsArrayBuffer(file);
  } else if(ext === 'xlsx' || ext === 'xls'){
    var reader = new FileReader();
    reader.onload = function(ev){
      if(typeof XLSX === 'undefined'){ toast('SheetJS 未加载，请刷新重试', 3000); return; }
      try {
        var wb = XLSX.read(ev.target.result, {type:'array'});
        var text = '';
        wb.SheetNames.forEach(function(name){
          text += XLSX.utils.sheet_to_csv(wb.Sheets[name]) + '\n';
        });
        target.value = text;
        toast('导入成功');
      } catch(err){ toast('解析失败: ' + err.message, 3000); }
    };
    reader.readAsArrayBuffer(file);
  } else if(ext === 'pdf'){
    toast('PDF 格式请先转换为文本后粘贴', 3000);
  } else if(ext === 'doc'){
    toast('旧版 .doc 请先转换为 .docx', 3000);
  } else if(ext === 'epub'){
    toast('EPUB 格式请先转换为文本后粘贴', 3000);
  } else {
    var reader = new FileReader();
    reader.onload = function(ev){ target.value = ev.target.result; toast('导入成功'); };
    reader.readAsText(file);
  }
  fileInput.value = '';
});

function mdToHTML(md){
  var lines = md.split('\n');
  var html = '', inList = false, inPara = false;
  for(var i=0;i<lines.length;i++){
    var line = lines[i];
    if(!line.trim()){
      if(inList){ html += '</ul>'; inList=false; }
      if(inPara){ html += '</p>'; inPara=false; }
      continue;
    }
    if(/^## (.+)/.test(line)){
      if(inList){ html += '</ul>'; inList=false; }
      if(inPara){ html += '</p>'; inPara=false; }
      html += '<h3>'+line.replace(/^## /,'')+'</h3>';
    } else if(/^### (.+)/.test(line)){
      if(inList){ html += '</ul>'; inList=false; }
      if(inPara){ html += '</p>'; inPara=false; }
      html += '<h4>'+line.replace(/^### /,'')+'</h4>';
    } else if(/^- /.test(line)){
      if(!inList){ html += '<ul>'; inList=true; }
      html += '<li>'+line.replace(/^- /,'').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</li>';
    } else {
      if(inList){ html += '</ul>'; inList=false; }
      if(!inPara){ html += '<p>'; inPara=true; } else { html += '<br>'; }
      html += line.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    }
  }
  if(inList) html += '</ul>';
  if(inPara) html += '</p>';
  return html;
}

function runAICompare(){
  var tA = textA.value.trim();
  var tB = textB.value.trim();
  if(!tA || !tB) return;

  aiResult.className = 'ai-result loading';
  aiResult.textContent = 'AI正在深度思考分析中...';

  var maxLen = 6000;
  var sA = tA.length > maxLen ? tA.substring(0, maxLen) + '\n...[文本过长已截断]' : tA;
  var sB = tB.length > maxLen ? tB.substring(0, maxLen) + '\n...[文本过长已截断]' : tB;

  var prompt = '请对以下两篇论文进行智能比较分析，严格按以下格式输出（直接输出分析内容，不要额外寒暄）：\n\n## 总体判断\n- 文本重复率（纯文字重复百分比）：[请估算百分比]\n- 整体近似度：低/中/高，并提供一句话说明\n- 论述核心与主要观点近似度：低/中/高，并提供一句话说明\n\n## 分段具体分析\n### 研究主题\n- 相同点：...\n- 不同点：...\n\n### 方法论\n- 相同点：...\n- 不同点：...\n\n### 核心论点\n- 相同点：...\n- 不同点：...\n\n### 论证逻辑与结构\n- 相同点：...\n- 不同点：...\n\n### 结论与创新点\n- 相同点：...\n- 不同点：...\n\n请用中文回答。\n\n【论文A】\n' + sA + '\n\n【论文B】\n' + sB;

  fetch('https://api.deepseek.com/chat/completions', {
    method: 'POST',
    headers: {'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
    body: JSON.stringify({
      model:'deepseek-chat',
      messages:[
        {role:'system',content:'你是一个专业的学术论文分析助手，擅长对论文进行结构、思路和方法论层面的比较分析。'},
        {role:'user',content:prompt}
      ],
      temperature:0.3,
      max_tokens:4096
    })
  })
  .then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+': '+t); });
    return r.json();
  })
  .then(function(data){
    var content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(content){
      aiResult.className = 'ai-result';
      aiResult.innerHTML = mdToHTML(content);
    } else {
      throw new Error('API返回数据异常');
    }
  })
  .catch(function(err){
    aiResult.className = 'ai-result error';
    aiResult.textContent = '智能检测失败: ' + err.message + '\n\n请检查网络连接或API Key是否有效。';
  });
}
